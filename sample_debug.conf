# sample_debug.conf — copy and adjust. Foreground, uvicorn --reload; background_server.sh refuses it. Nothing here is secret:
# the password, key and secret are fixed test values, never for a deployment.

[product]
# Where club_server comes from: a checkout to run in place (relative to this
# file), or a git URL cloned at `ref` into the run directory.
#   source = ../../server/club_server
source = https://github.com/cloudonlanapps/club_server.git
ref    = main

[server]
port               = 8101
db_port            = 5437
debug              = true
bootstrap_password = devboot
secret_key         = native-test-secret-key
# db_user / db_password / db_name default to myclub / devpass / myclub

[settings]
# Every key is exported upper-cased; <port> becomes the server port.
cors_allowed_origins     = *
club_name                = Local Test Club
club_short_name          = LTC
login_url                = http://localhost:<port>
server_base_url          = http://localhost:<port>
email_from_transactional = admin@localhost.invalid
email_from_broadcast     = noreply@localhost.invalid
email_theme_color        = #E8772E
environment              = development
# base64 of 32 zero bytes: lets encrypted uploads work on a throwaway stack
encryption_key           = AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
credit_system_enabled          = true
evaluations_enabled            = true
event_marketing_enabled        = true
# club_server#92, #93: the extended profile fields, and printable application
# forms (applications need identity_verification_required on too)
extended_profile_enabled       = true
applications_enabled           = true
# on is the server's default; off, a new user registers straight to pending
identity_verification_required = true
# Swagger, ReDoc and /openapi.json, off by default on the server (club_server#78);
# the SDK's endpoint contract test reads /openapi.json from this stack
api_docs_enabled               = true
